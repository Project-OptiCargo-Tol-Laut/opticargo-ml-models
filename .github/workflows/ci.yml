name: opticargo-ml-models CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest
      - run: python -m compileall -q src tests
      - name: Smoke generate and train all models
        run: |
          python -m opticargo_ml_models.training.generate_all --rows 2500 --output-dir /tmp/opticargo-data
          python -m opticargo_ml_models.training.train_all --data-dir /tmp/opticargo-data --artifact-dir /tmp/opticargo-artifacts --release ci-smoke
